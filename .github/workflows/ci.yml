name: CI

# Runs on every push to main and on all PRs so that strict-mode type errors,
# broken builds, and failing tests are caught before they land — the deploy
# workflow only runs at release time and never type-checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit, strict)
        run: npm run type-check

      - name: Test
        run: npx vitest run

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # src/data/fieldRegistry.json must match the canonical field registry of
      # the dicompare version the app pins (src/version.ts) — the same source
      # of truth the protocol importers use. Regenerate with:
      #   npm run sync:registry
      - name: Field registry drift check
        run: |
          VERSION=$(sed -n "s/.*DICOMPARE_VERSION = '\(.*\)'.*/\1/p" src/version.ts)
          echo "Pinned dicompare version: $VERSION"
          pip install --quiet "dicompare==$VERSION"
          if python -c "import dicompare.fields" 2>/dev/null; then
            python -m dicompare.fields > /tmp/fieldRegistry.json
            if ! diff -u src/data/fieldRegistry.json /tmp/fieldRegistry.json; then
              echo "::error::src/data/fieldRegistry.json is out of sync with dicompare==$VERSION. Regenerate with 'npm run sync:registry' and commit."
              exit 1
            fi
          else
            echo "dicompare==$VERSION predates the field registry; skipping drift check."
          fi

      - name: Build
        run: npm run build
