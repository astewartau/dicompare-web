name: CI

# Runs on every push to main and on all PRs so that strict-mode type errors,
# broken builds, and failing tests are caught before they land — the deploy
# workflow only runs at release time and never type-checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit, strict)
        run: npm run type-check

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
